<svg width="1600" height="720" viewBox="0 0 1600 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 20px Arial, sans-serif; fill: #334155; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .text { font: 500 16px Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 14px Arial, sans-serif; fill: #475569; }
      .pill { font: 700 14px Arial, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="#f8fafc"/>

  <text x="60" y="62" class="title">worker-ai-chatbot architecture and workflow</text>
  <text x="60" y="98" class="subtitle">Cloudflare Worker request path with highlighted LLM and RAG components</text>

  <rect x="60" y="130" width="1480" height="550" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="176" class="subtitle">Runtime query workflow</text>

  <rect x="90" y="200" width="180" height="150" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="118" y="264" class="label">User / Web APP</text>
  <text x="118" y="292" class="text">POST /chatbot</text>

  <rect x="320" y="200" width="360" height="150" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="244" class="label">Cloudflare Worker</text>
  <text x="350" y="272" class="text">src/worker.js</text>
  <text x="350" y="300" class="small">CORS + request validation + prompt assembly</text>

  <rect x="760" y="170" width="760" height="290" rx="26" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
  <text x="785" y="214" class="label">RAG retrieval block</text>
  <text x="785" y="238" class="small">Embed question, search vector index, then retrieve notes from SQL</text>

  <rect x="780" y="280" width="200" height="120" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="825" y="260" width="110" height="30" rx="15" fill="#f59e0b"/>
  <text x="863" y="280" class="pill">LLM</text>
  <text x="800" y="345" class="label">Embedding model</text>

  <rect x="1075" y="280" width="170" height="120" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115" y="345" class="label">Vector DB</text>
  <text x="1093" y="370" class="small">topK similarity search</text>

  <rect x="1333" y="280" width="170" height="120" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1380" y="345" class="label">SQL DB</text>
  <text x="1360" y="370" class="small">Select notes by ids</text>

  <rect x="770" y="550" width="330" height="120" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
  <rect x="880" y="530" width="96" height="30" rx="15" fill="#ef4444"/>
  <text x="913" y="550" class="pill">LLM</text>
  <text x="850" y="610" class="label">Answer Generation</text>
  <text x="810" y="635" class="small">Uses retrieved notes as verified context</text>

  <rect x="1240" y="550" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1275" y="610" class="label">JSON Response</text>

  <line x1="270" y1="275" x2="320" y2="275" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <line x1="680" y1="275" x2="755" y2="275" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow-strong)"/>
  <text x="688" y="255" class="small">user_input</text>

  <line x1="980" y1="340" x2="1070" y2="340" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="988" y="322" class="small">query vector</text>

  <line x1="1245" y1="340" x2="1330" y2="340" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1248" y="322" class="small">matched ids</text>

  <path d="M 1420 400 C 1420 470, 1037 400, 1037 538" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1110" y="483" class="small">retrieved notes</text>

  <path d="M 680 315 C 720 315, 650 610, 768 610" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="595" y="450" class="small">system prompt</text>
  <text x="620" y="472" class="small">+</text>
  <text x="595" y="490" class="small">user input</text>

  <line x1="1100" y1="610" x2="1238" y2="610" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1110" y="592" class="small">generated answer</text>

  <rect x="1120" y="110" width="400" height="40" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="1150" cy="130" r="8" fill="#ef4444"/>
  <text x="1170" y="136" class="small">Red = answer LLM</text>
  <circle cx="1350" cy="130" r="8" fill="#06b6d4"/>
  <text x="1370" y="136" class="small">Cyan = RAG zone</text>
</svg>
