<svg width="1920" height="720" viewBox="0 0 1920 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 20px Arial, sans-serif; fill: #334155; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .text { font: 500 16px Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 14px Arial, sans-serif; fill: #475569; }
      .pill { font: 700 14px Arial, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1920" height="720" fill="#f8fafc"/>

  <text x="60" y="62" class="title">Cloudflare Worker AI Chatbot System Architecture</text>
  <text x="60" y="98" class="subtitle">End-to-end request path showing Cloudflare Worker, RAG pipeline, and LLM integrations</text>

  <rect x="60" y="130" width="1700" height="550" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="176" class="subtitle">Runtime Query Workflow</text>

  <!-- HTTP Request -->
  <rect x="90" y="200" width="190" height="150" rx="18" fill="#dbeafe" stroke="#0a4bd7" stroke-width="2" filter="url(#shadow)"/>
  <text x="118" y="244" class="label">HTTP Request</text>
  <text x="118" y="274" class="text">POST /chatbot</text>
  <text x="118" y="298" class="text">Payload: user prompt</text>

  <!-- Middleware -->
  <rect x="330" y="200" width="160" height="150" rx="18" fill="#eef2ff" stroke="#656579" stroke-width="2" filter="url(#shadow)"/>
  <text x="354" y="244" class="label">Middleware</text>
  <text x="354" y="274" class="text">CORS handling</text>
  <text x="354" y="298" class="text">Rate limit by IP</text>

  <!-- Cloudflare Worker -->
  <rect x="540" y="200" width="270" height="150" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="564" y="244" class="label">Cloudflare Worker</text>
  <text x="564" y="274" class="text">1. Call RAG</text>
  <text x="564" y="298" class="text">2. Inject notes into prompt</text>
  <text x="564" y="322" class="text">3. Call LLM</text>

  <!-- RAG System -->
  <rect x="945" y="200" width="790" height="290" rx="26" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
  <text x="970" y="244" class="label">RAG System</text>
  <text x="970" y="274" class="text">Vector DB holds pre-embedded note vectors; Relational DB stores the full note contents</text>

  <rect x="965" y="310" width="185" height="120" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1000" y="295" width="110" height="30" rx="15" fill="#f59e0b"/>
  <text x="1038" y="315" class="pill">LLM</text>
  <text x="980" y="360" class="label">Embedding Model</text>
  <text x="980" y="395" class="text">Vectorize user prompt</text>

  <rect x="1270" y="310" width="180" height="120" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1285" y="360" class="label">Vector DB</text>
  <text x="1285" y="395" class="text">top-k similarity search</text>

  <rect x="1545" y="310" width="170" height="120" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1560" y="360" class="label">Relational DB</text>
  <text x="1560" y="395" class="text">Select notes by IDs</text>

  <!-- Response Generation -->
  <rect x="540" y="460" width="270" height="120" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
  <rect x="627" y="445" width="96" height="30" rx="15" fill="#ef4444"/>
  <text x="660" y="465" class="pill">LLM</text>
  <text x="564" y="510" class="label">Response Generation</text>
  <text x="564" y="545" class="text">Synthesizes answer with context</text>

  <!-- HTTP response -->
  <rect x="1515" y="550" width="220" height="110" rx="18" fill="#dbeafe" stroke="#0a4bd7" stroke-width="2" filter="url(#shadow)"/>
  <text x="1543" y="594" class="label">HTTP Response</text>

  <!-- Arrows: top flow -->
  <line x1="280" y1="275" x2="328" y2="275" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="490" y1="275" x2="538" y2="275" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="810" y1="262" x2="943" y2="262" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-strong)"/>
  <text x="830" y="252" class="small">user prompt</text>

  <line x1="945" y1="292" x2="812" y2="292" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-strong)"/>
  <text x="830" y="323" class="small">retrieved notes</text>

  <!-- RAG internal arrows -->
  <line x1="1150" y1="370" x2="1268" y2="370" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1158" y="350" class="small">query by vector</text>

  <line x1="1450" y1="370" x2="1543" y2="370" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1458" y="350" class="small">query by IDs</text>

  <!-- Cloudflare Worker <-> Answer Generation (LLM) -->
  <line x1="660" y1="351" x2="660" y2="444" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-strong)"/>
  <line x1="690" y1="444" x2="690" y2="351" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-strong)"/>
  <text x="550" y="380" class="small">user prompt</text>
  <text x="550" y="400" class="small">system prompt</text>
  <text x="550" y="420" class="small">retrieved notes</text>
  <text x="700" y="400" class="small">LLM result</text>

  <!-- Cloudflare Worker -> HTTP Response -->
  <path d="M 810 350 C 810 600, 1513 600, 1515 600" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="950" y="560" class="small">JSON response</text>

  <!-- Legend -->
  <rect x="1190" y="110" width="520" height="40" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="1218" cy="130" r="8" fill="#06b6d4"/>
  <text x="1236" y="136" class="small">RAG zone</text>
  <circle cx="1338" cy="130" r="8" fill="#f59e0b"/>
  <text x="1356" y="136" class="small">Text Embedding LLM</text>
  <circle cx="1526" cy="130" r="8" fill="#ef4444"/>
  <text x="1544" y="136" class="small">Text Generation LLM</text>

  <!-- Note: Cloudflare AI Gateway -->
  <rect x="90" y="460" width="425" height="140" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="118" y="510" class="label">Cloudflare AI Gateway</text>
  <text x="118" y="540" class="text">All LLM calls are routed through Cloudflare AI Gateway</text>
  <text x="118" y="564" class="text">for caching and cost control.</text>
</svg>
